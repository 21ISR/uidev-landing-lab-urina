<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botanica - Авторские букеты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <div class="header__container">
            <a href="#" class="header__logo">
                <img src="logo.svg" alt="Botanica studio" class="logo__img">
            </a>
            <nav class="header__nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="#about" class="nav__link">О студии</a></li>
                    <li class="nav__item"><a href="#services" class="nav__link">Услуги</a></li>
                    <li class="nav__item"><a href="#gallery" class="nav__link">Галерия</a></li>
                    <li class="nav__item"><a href="#reviews" class="nav__link">Отзывы</a></li>
                    <li class="nav__item"><a href="#contacts" class="nav__link">Контакты</a></li>
                </ul>
            </nav>
            <button class="header__button">Заказать букет</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero__container">
                <div class="hero__content">
                    <h1 class="hero__title">Цветы,<br>которые говорят<br><span class="hero__title-accent">за вас</span></h1>
                    <p class="hero__subtitle">Авторские букеты и композиции<br>для особенных моментов</p>
                    <div class="hero__actions">
                        <button class="hero__button">Заказать букет</button>
                        <a href="#" class="hero__video-link">
                            <span class="video-link__icon">▶</span>Смотреть видео
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
